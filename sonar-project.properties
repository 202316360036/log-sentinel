# sonar-project.properties
#
# Projeto ja criado no SonarCloud sob a organizacao aryanassis. Se algum dos
# integrantes precisar recriar, atualizar as duas chaves abaixo e o secret
# SONAR_TOKEN no repositorio.

sonar.projectKey=AryanAssis_ENGS2
sonar.organization=aryanassis
sonar.projectName=Log Sentinel

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14

# Cobertura: o pyproject.toml ja configura pytest para gerar coverage.xml
# (secao [tool.pytest.ini_options], flag --cov-report=xml).
sonar.python.coverage.reportPaths=coverage.xml

# Exclusoes de arquivos que nao devem entrar na analise nem inflar o total de linhas.
sonar.exclusions=**/__pycache__/**,**/*.pyc,dist/**,build/**,.venv/**,notes/**
sonar.test.exclusions=**/__pycache__/**,**/*.pyc
# A lista abaixo replica o [tool.coverage.run].omit do pyproject.toml.
# Sem isso, o Sonar ve os arquivos em src/ mas nao os encontra no
# coverage.xml (que ja vem sem eles), conta como 0% coberto e derruba
# a media geral. Os arquivos excluidos daqui sao bootstrap/wiring de
# GUI (main.py, main_window.py, models.py) e o entrypoint (__main__.py),
# que sao cobertos por inspecao manual e pelo smoke test do binario no
# CI, nao por unit test.
sonar.coverage.exclusions=tests/**,**/__main__.py,**/gui/main.py,**/gui/main_window.py,**/gui/models.py
