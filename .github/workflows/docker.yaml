name: Publicar imagem Docker

# Publica a imagem no GitHub Container Registry a cada tag v* e permite
# execucao manual pelo botao "Run workflow" no painel do Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Build e push para ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test da imagem publicada, provando que o binario dentro
      # do container roda de fato contra uma fixture do repo.
      - name: Smoke test da imagem
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          echo "Testando imagem: $IMAGE"
          docker run --rm \
            -v "${{ github.workspace }}/tests/fixtures:/logs:ro" \
            "$IMAGE" analyze /logs/sample.log
